events {
    worker_connections 1024;
}

http {
    upstream auth_svc        { server auth:8001; }
    upstream users_svc       { server users:8002; }
    upstream catalog_svc     { server catalog:8003; }
    upstream suppliers_svc   { server suppliers:8004; }
    upstream admin_svc       { server admin:8011; }
    upstream demand_svc      { server demand:8012; }
    upstream orders_svc      { server orders:8005; }
    upstream payments_svc    { server payments:8006; }
    upstream pricing_svc     { server pricing:8007; }
    upstream trends_svc      { server trends:8008; }
    upstream notifications_svc { server notifications:8009; }
    upstream calculator_svc   { server calculator:8010; }

    server {
        listen 80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth
        location /v1/auth/ {
            proxy_pass http://auth_svc;
        }

        # Users — covers /v1/user, /v1/users/, /v1/onboarding/
        location ~ ^/v1/(user$|users/|onboarding/) {
            proxy_pass http://users_svc;
        }

        # Catalog
        location /v1/catalog/ {
            proxy_pass http://catalog_svc;
        }

        # Suppliers
        location /v1/suppliers/ {
            proxy_pass http://suppliers_svc;
        }

        # Admin umbrella / BFF
        location /v1/admin/ {
            proxy_pass http://admin_svc;
        }

        # Demand requests
        location = /v1/demand-requests {
            proxy_pass http://demand_svc;
        }

        location /v1/demand-requests/ {
            proxy_pass http://demand_svc;
        }

        # Orders
        location /v1/orders/ {
            proxy_pass http://orders_svc;
        }

        # Payments
        location /v1/payments/ {
            proxy_pass http://payments_svc;
        }

        # Pricing
        location /v1/pricing/ {
            proxy_pass http://pricing_svc;
        }

        # Trends
        location /v1/trends {
            proxy_pass http://trends_svc;
        }

        # Notifications
        location = /v1/notifications {
            proxy_pass http://notifications_svc;
        }

        location /v1/notifications/ {
            proxy_pass http://notifications_svc;
        }

        # Calculator
        location /v1/calculator/ {
            proxy_pass http://calculator_svc;
        }

        # Health — route to auth as the primary liveness probe
        location /health {
            proxy_pass http://auth_svc;
        }
    }
}

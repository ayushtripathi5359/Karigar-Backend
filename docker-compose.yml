version: "3.9"

# All services share one PostgreSQL DB and one .env file.
# Build context is always the karigar-api/ root so Dockerfiles can COPY shared/.

x-service-defaults: &service-defaults
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: karigar_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API Gateway (nginx) ──────────────────────────────────────────────────────
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - users
      - catalog
      - suppliers
      - orders
      - payments
      - pricing
      - trends
      - notifications
      - calculator
    restart: unless-stopped

  # ── Services ────────────────────────────────────────────────────────────────
  auth:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "8001:8001"

  users:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/users/Dockerfile
    ports:
      - "8002:8002"

  catalog:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    ports:
      - "8003:8003"

  suppliers:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/suppliers/Dockerfile
    ports:
      - "8004:8004"

  orders:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    ports:
      - "8005:8005"

  payments:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    ports:
      - "8006:8006"

  pricing:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/pricing/Dockerfile
    ports:
      - "8007:8007"

  trends:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/trends/Dockerfile
    ports:
      - "8008:8008"

  notifications:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    ports:
      - "8009:8009"

  calculator:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/calculator/Dockerfile
    ports:
      - "8010:8010"

volumes:
  pgdata:
